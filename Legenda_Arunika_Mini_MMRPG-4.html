<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Legenda Arunika — Mini MMORPG</title>
<style>
:root{--gold:#ffd66b;--panel:rgba(13,22,34,.91);--line:#8cb7c5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15242b;color:#fff;font-family:system-ui,Segoe UI,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated;background:#57975d}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:1px 2px 2px #17202b}
.panel{background:linear-gradient(135deg,rgba(14,27,42,.92),rgba(28,44,52,.82));border:2px solid #739aa4;border-radius:10px;box-shadow:0 3px 0 #263d43,inset 0 0 0 1px #d3d7ad55}
#profile{position:absolute;left:10px;top:10px;width:220px;padding:8px;display:flex;gap:9px;align-items:center}
.portrait{width:48px;height:48px;border-radius:8px;background:#396a85;border:2px solid #f4d27a;display:grid;place-items:center;font-size:27px}
.small{font-size:11px;color:#d9e8e5}.name{font-weight:800;color:#ffe69a;font-size:14px}
.bar{height:8px;background:#24343b;border:1px solid #07151a;border-radius:6px;overflow:hidden;margin-top:3px}.fill{height:100%;width:100%;transition:width .15s}
#hp{background:#e34d5c}#mp{background:#4b9bff}#xp{background:#f3c44e}
#stats{flex:1}#quest{position:absolute;left:10px;top:104px;padding:9px 11px;width:220px;font-size:12px;line-height:1.5}
#quest strong{color:#ffe69a}#minimap{position:absolute;right:10px;top:10px;width:124px;height:124px;overflow:hidden;border-radius:9px;border:2px solid #d6c18b;background:#315947}
#mapCanvas{width:100%;height:100%}
#bottom{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:5px;align-items:center}
.slot{width:42px;height:42px;border:2px solid #9bb9bb;border-radius:7px;background:#172b3ddd;display:grid;place-items:center;font-size:21px;position:relative}
.slot small{position:absolute;bottom:1px;right:3px;font-size:9px;color:#ffedb2}
#joystick{position:absolute;left:20px;bottom:28px;width:118px;height:118px;border-radius:50%;background:#0b182866;border:2px solid #d5e3d355;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#c5e2e9aa;border:2px solid #eff7e9}
#actions{position:absolute;right:15px;bottom:24px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:7px;pointer-events:auto}
.action{border-radius:50%;border:2px solid #e6d18b;background:linear-gradient(#527d91,#213e54);color:white;font-size:22px;box-shadow:0 3px 0 #122631;touch-action:none}
.action:active,.action.active{transform:translateY(2px);filter:brightness(1.35)}
#attack{grid-column:3;grid-row:2;background:linear-gradient(#c96951,#743a36);font-size:26px}
#skill1{grid-column:2;grid-row:2}#skill2{grid-column:1;grid-row:2}#potion{grid-column:3;grid-row:1}
#hint{position:absolute;bottom:148px;right:15px;font-size:11px;color:#fff0c7;text-align:right}
#toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);padding:10px 16px;background:#142331e8;border:1px solid #e8d18a;border-radius:8px;display:none;text-align:center;max-width:85%;font-weight:700}
#menuBtn{position:absolute;right:145px;top:14px;pointer-events:auto;border:1px solid #e3d18c;background:#172d3ce8;color:#fff;border-radius:8px;padding:8px 10px}
#modal{position:fixed;inset:0;background:#07111bcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal .box{width:min(440px,100%);max-height:85dvh;overflow:auto;padding:17px;background:#172c39;border:2px solid #d6bd79;border-radius:12px;box-shadow:0 8px 30px #0009}
#modal h2{margin:0 0 10px;color:#ffdf8a}#modal p{line-height:1.55;color:#e0e9e5;font-size:14px}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menuGrid button,.closeBtn{padding:10px;border-radius:8px;border:1px solid #8bb5bb;background:#28495a;color:white;font-weight:700}
#log{font-size:12px;color:#c5d9d5;min-height:25px}
@media(min-width:800px){#joystick{left:32px;bottom:32px}#actions{right:28px;bottom:28px}.action{width:60px;height:60px}#actions{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px)}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="profile" class="panel"><div class="portrait">🧙</div><div id="stats"><div class="name">Arunika <span class="small">Lv.<b id="level">1</b></span></div><div class="bar"><div id="hp" class="fill"></div></div><div class="bar"><div id="mp" class="fill"></div></div><div class="bar"><div id="xp" class="fill" style="width:0%"></div></div><div class="small">HP <span id="hpText">100/100</span> · MP <span id="mpText">40/40</span></div></div></div>
 <div id="quest" class="panel"><strong>✦ Petualangan Pertama</strong><br>Kalahkan slime: <span id="kills">0</span>/3<br><span class="small">Hadiah: 35 EXP · 20 Gold</span></div>
 <div id="minimap"><canvas id="mapCanvas" width="124" height="124"></canvas></div>
 <button id="menuBtn">☰ Menu</button>
 <div id="bottom"><div class="slot">🧪<small id="potCount">3</small></div><div class="slot">🗡️</div><div class="slot">🛡️</div><div class="slot">💎</div><div class="slot">🪙 <small id="gold">0</small></div></div>
 <div id="joystick"><div id="stick"></div></div>
 <div id="actions"><button id="potion" class="action" aria-label="Potion">🧪</button><button id="skill2" class="action" aria-label="Skill area">❄️</button><button id="skill1" class="action" aria-label="Skill">✨</button><button id="attack" class="action" aria-label="Attack">⚔️</button></div>
 <div id="hint">Gerakkan joystick · ⚔️ serang monster<br>✨ skill · 🧪 pulihkan HP</div>
 <div id="toast"></div>
</div>
<div id="modal"><div class="box"><h2 id="modalTitle">Legenda Arunika</h2><div id="modalContent"></div><button class="closeBtn" id="closeModal" style="width:100%;margin-top:10px">Kembali ke game</button></div></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'), mini=document.getElementById('mapCanvas'),mctx=mini.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const TILE=32, MW=64,MH=64, worldW=MW*TILE,worldH=MH*TILE;
let seed=19371;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const tiles=[];for(let y=0;y<MH;y++){tiles[y]=[];for(let x=0;x<MW;x++){let v=rand();tiles[y][x]=v<.12?1:v<.16?2:0}}
function isPath(x,y){return (Math.abs(y-31)<2)||(Math.abs(x-31)<2)||(Math.abs(x-18)<1&&y>18&&y<45)||(Math.abs(y-17)<1&&x>18&&x<44)}
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(isPath(x,y))tiles[y][x]=3;if((x>39&&x<45&&y>35&&y<43))tiles[y][x]=4}
let obstacles=[];
for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++){if(tiles[y][x]===1 && !isPath(x,y) && rand()<.78)obstacles.push({x:x*TILE+16,y:y*TILE+16,type:'tree',r:12});else if(tiles[y][x]===2&&!isPath(x,y)&&rand()<.7)obstacles.push({x:x*TILE+16,y:y*TILE+16,type:'rock',r:9})}
const player={x:31*TILE+16,y:31*TILE+16,r:10,hp:100,maxHp:100,mp:40,maxMp:40,level:1,xp:0,next:60,gold:0,potions:3,dirX:1,dirY:0,attackCd:0,skillCd:0,iceCd:0,invuln:0};
let mobs=[],kills=0,toastTimer=0,log='Selamat datang di Arunika!';
function spawnMob(x,y,type='slime'){mobs.push({x,y,r:type==='goblin'?11:10,type,hp:type==='goblin'?48:30,maxHp:type==='goblin'?48:30,hit:0,attack:0,alive:true})}
for(let i=0;i<30;i++){let x=(12+rand()*40)*TILE,y=(10+rand()*42)*TILE;if(Math.hypot(x-player.x,y-player.y)>170)spawnMob(x,y,rand()<.18?'goblin':'slime')}
const npcs=[{x:31*TILE+48,y:31*TILE-44,name:'Mira',emoji:'🧝'},{x:18*TILE+25,y:17*TILE+25,name:'Pedagang',emoji:'🧔'}];
let camX=0,camY=0,keys={},joy={x:0,y:0,active:false,pointer:null};
const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').style.display='block';toastTimer=2.5}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function collides(x,y,r){if(x<r||y<r||x>worldW-r||y>worldH-r)return true;for(const o of obstacles){if(Math.hypot(x-o.x,y-o.y)<r+o.r-2)return true}return false}
function moveEntity(ent,dx,dy){if(!collides(ent.x+dx,ent.y,ent.r))ent.x+=dx;if(!collides(ent.x,ent.y+dy,ent.r))ent.y+=dy}
function drawTile(x,y,sx,sy,t){let colors=['#67a85d','#397f4b','#8b9691','#c4a36d','#4f9cc0'];ctx.fillStyle=colors[t]||colors[0];ctx.fillRect(sx,sy,TILE,TILE);if(t===0){ctx.fillStyle='#8dc66b';ctx.fillRect(sx+5,sy+7,3,2);ctx.fillRect(sx+23,sy+22,2,3)}if(t===3){ctx.fillStyle='#d7bb83';ctx.fillRect(sx+3,sy+8,7,2);ctx.fillRect(sx+18,sy+22,8,2)}if(t===4){ctx.fillStyle='#80c9dd';ctx.fillRect(sx,sy+5,TILE,2);ctx.fillRect(sx+12,sy+20,13,2)}}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawTree(o){let x=o.x-camX,y=o.y-camY;ctx.fillStyle='#65472f';ctx.fillRect(x-4,y-2,8,20);ctx.fillStyle='#255d3e';ctx.beginPath();ctx.arc(x,y-9,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#34794b';ctx.beginPath();ctx.arc(x-6,y-15,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4a9658';ctx.beginPath();ctx.arc(x+6,y-17,9,0,Math.PI*2);ctx.fill()}
function drawMob(m){let x=m.x-camX,y=m.y-camY;if(x<-40||y<-40||x>W+40||y>H+40)return;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,10,13,5,0,0,Math.PI*2);ctx.fill();if(m.type==='slime'){ctx.fillStyle=m.hit>0?'#fff':'#70e2bd';ctx.beginPath();ctx.ellipse(0,0,12,10,0,Math.PI,Math.PI*2);ctx.lineTo(12,3);ctx.quadraticCurveTo(0,17,-12,3);ctx.fill();ctx.fillStyle='#153e4c';ctx.fillRect(-5,-1,2,3);ctx.fillRect(4,-1,2,3)}else{ctx.fillStyle=m.hit>0?'#fff':'#8dca70';ctx.beginPath();ctx.arc(0,-2,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7e7b8';ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(-12,-17);ctx.lineTo(-2,-10);ctx.moveTo(7,-8);ctx.lineTo(12,-17);ctx.lineTo(2,-10);ctx.fill();ctx.fillStyle='#202c2b';ctx.fillRect(-5,-4,2,3);ctx.fillRect(4,-4,2,3)}ctx.restore();if(m.hp<m.maxHp){rounded(x-14,y-20,28,4,2,'#2a3435');rounded(x-14,y-20,28*m.hp/m.maxHp,4,2,'#ef5260')}}
function drawPlayer(){let x=player.x-camX,y=player.y-camY;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+10,12,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eac89a';ctx.beginPath();ctx.arc(x,y-6,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3e6aab';ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x+9,y-3);ctx.lineTo(x+11,y+9);ctx.lineTo(x-11,y+9);ctx.fill();ctx.fillStyle='#f1d47b';ctx.fillRect(x-2,y-1,4,9);ctx.fillStyle='#4d3428';ctx.fillRect(x-7,y+9,5,5);ctx.fillRect(x+3,y+9,5,5);ctx.fillStyle='#d7e4e4';ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(player.dirY,player.dirX));ctx.fillRect(7,-2,15,3);ctx.fillStyle='#f4d58a';ctx.fillRect(7,-4,3,7);ctx.restore();if(player.invuln>0){ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.stroke()}}
function drawNpc(n){let x=n.x-camX,y=n.y-camY;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+8,10,4,0,0,7);ctx.fill();ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(n.emoji,x,y+5);ctx.font='10px sans-serif';ctx.fillStyle='#fff1b0';ctx.fillText(n.name,x,y-15);if(n.name==='Mira'&&kills<3){ctx.fillStyle='#ffd85e';ctx.font='bold 15px sans-serif';ctx.fillText('!',x,y-28)}}
function drawMini(){mctx.clearRect(0,0,124,124);for(let y=0;y<MW;y+=2)for(let x=0;x<MH;x+=2){let t=tiles[y]?.[x]||0;mctx.fillStyle=['#69a65e','#286c42','#85908d','#c3a36d','#4f9cc0'][t];mctx.fillRect(x/64*124,y/64*124,3,3)}for(const m of mobs){mctx.fillStyle='#e7e77a';mctx.fillRect(m.x/worldW*124,m.y/worldH*124,2,2)}mctx.fillStyle='#ff5b68';mctx.beginPath();mctx.arc(player.x/worldW*124,player.y/worldH*124,3,0,7);mctx.fill()}
function render(){ctx.clearRect(0,0,W,H);camX=clamp(player.x-W/2,0,worldW-W);camY=clamp(player.y-H/2,0,worldH-H);let x0=Math.floor(camX/TILE),y0=Math.floor(camY/TILE),x1=Math.ceil((camX+W)/TILE),y1=Math.ceil((camY+H)/TILE);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(x>=0&&y>=0&&x<MW&&y<MH)drawTile(x,y,x*TILE-camX,y*TILE-camY,tiles[y][x])}
 // decorative flowers and village buildings
 for(let b of [{x:28,y:26,c:'#c16f58'},{x:34,y:26,c:'#8e6fbb'},{x:15,y:14,c:'#d0a24f'}]){let x=b.x*TILE-camX,y=b.y*TILE-camY;if(x>-80&&y>-70&&x<W+80&&y<H+80){ctx.fillStyle='#0004';ctx.fillRect(x+4,y+24,46,8);ctx.fillStyle='#d5b98a';ctx.fillRect(x,y,48,30);ctx.fillStyle=b.c;ctx.beginPath();ctx.moveTo(x-5,y+5);ctx.lineTo(x+24,y-15);ctx.lineTo(x+53,y+5);ctx.fill();ctx.fillStyle='#5c4030';ctx.fillRect(x+19,y+12,10,18);ctx.fillStyle='#9bc8d0';ctx.fillRect(x+5,y+9,8,7);ctx.fillRect(x+35,y+9,8,7)}}
 for(const o of obstacles)if(o.type==='tree')drawTree(o);else{let x=o.x-camX,y=o.y-camY;ctx.fillStyle='#777e7b';ctx.beginPath();ctx.moveTo(x-10,y+7);ctx.lineTo(x-7,y-6);ctx.lineTo(x+1,y-11);ctx.lineTo(x+10,y-4);ctx.lineTo(x+12,y+7);ctx.fill()}
 for(const n of npcs)drawNpc(n);for(const m of mobs)if(m.alive)drawMob(m);drawPlayer();
 // subtle border vignette
 let g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0000');g.addColorStop(1,'#071b1b55');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawMini()}
let last=performance.now();
function update(dt){if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.display='none'}player.attackCd=Math.max(0,player.attackCd-dt);player.skillCd=Math.max(0,player.skillCd-dt);player.iceCd=Math.max(0,player.iceCd-dt);player.invuln=Math.max(0,player.invuln-dt);
let dx=joy.x,dy=joy.y;if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}if(len>.08){player.dirX=dx;player.dirY=dy;moveEntity(player,dx*125*dt,dy*125*dt)}
for(const m of mobs){if(!m.alive)continue;m.hit=Math.max(0,m.hit-dt);m.attack=Math.max(0,m.attack-dt);let d=Math.hypot(player.x-m.x,player.y-m.y);if(d<190){if(d>24){let vx=(player.x-m.x)/(d||1),vy=(player.y-m.y)/(d||1);moveEntity(m,vx*(m.type==='goblin'?43:31)*dt,vy*(m.type==='goblin'?43:31)*dt)}else if(m.attack<=0&&player.invuln<=0){player.hp=Math.max(0,player.hp-(m.type==='goblin'?9:5));player.invuln=.65;m.attack=1.1;if(player.hp<=0){player.hp=50;player.x=31*TILE+16;player.y=31*TILE+16;toast('Kamu pingsan dan kembali ke desa. HP dipulihkan sebagian.')}}}}
$('hp').style.width=player.hp/player.maxHp*100+'%';$('mp').style.width=player.mp/player.maxMp*100+'%';$('xp').style.width=player.xp/player.next*100+'%';$('hpText').textContent=Math.ceil(player.hp)+'/'+player.maxHp;$('mpText').textContent=Math.ceil(player.mp)+'/'+player.maxMp;$('level').textContent=player.level;$('kills').textContent=kills;$('gold').textContent=player.gold;$('potCount').textContent=player.potions}
function nearestMob(range=62){let best=null,bd=range;for(const m of mobs){if(!m.alive)continue;let d=Math.hypot(m.x-player.x,m.y-player.y);if(d<bd){best=m;bd=d}}return best}
function damageMob(m,damage){m.hp-=damage;m.hit=.18;if(m.hp<=0){m.alive=false;player.xp+=m.type==='goblin'?18:12;player.gold+=m.type==='goblin'?8:3;if(m.type==='slime')kills++;if(player.xp>=player.next){player.xp-=player.next;player.level++;player.next=Math.floor(player.next*1.45);player.maxHp+=15;player.hp=player.maxHp;player.maxMp+=5;player.mp=player.maxMp;toast('LEVEL UP! Kamu sekarang level '+player.level+'!')}else toast(m.type==='slime'?'Slime dikalahkan! +EXP +Gold':'Goblin dikalahkan! +EXP +Gold');if(kills===3)toast('Quest selesai! Temui Mira di dekat desa.');if(rand()<.18)toast('Monster menjatuhkan kristal kecil!');setTimeout(()=>{if(mobs.filter(a=>a.alive).length<24)spawnMob((12+rand()*40)*TILE,(10+rand()*42)*TILE,rand()<.2?'goblin':'slime')},3500)}}
function attack(){if(player.attackCd>0)return;player.attackCd=.42;let m=nearestMob(66);if(m){damageMob(m,18+player.level*3)}else toast('Tidak ada monster dalam jangkauan!')}
function skill(){if(player.skillCd>0)return;if(player.mp<8){toast('MP tidak cukup!');return}player.mp-=8;player.skillCd=2.4;let n=0;for(const m of mobs)if(m.alive&&Math.hypot(m.x-player.x,m.y-player.y)<100){damageMob(m,26+player.level*4);n++}toast(n?'✨ Ledakan sihir mengenai '+n+' monster!':'✨ Sihir dilepaskan, tetapi tidak mengenai monster.')}
function ice(){if(player.iceCd>0)return;if(player.mp<12){toast('MP tidak cukup!');return}player.mp-=12;player.iceCd=4;let n=0;for(const m of mobs)if(m.alive&&Math.hypot(m.x-player.x,m.y-player.y)<135){damageMob(m,18+player.level*2);m.attack=2;n++}toast(n?'❄️ Badai es mengenai '+n+' monster!':'❄️ Badai es dilepaskan!')}
function potion(){if(player.potions<=0){toast('Potion habis!');return}if(player.hp===player.maxHp){toast('HP masih penuh!');return}player.potions--;player.hp=Math.min(player.maxHp,player.hp+45);toast('HP pulih 45!')}
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('skill1').addEventListener('pointerdown',e=>{e.preventDefault();skill()});$('skill2').addEventListener('pointerdown',e=>{e.preventDefault();ice()});$('potion').addEventListener('pointerdown',e=>{e.preventDefault();potion()});
const joyEl=$('joystick'),stick=$('stick');function joyMove(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=37;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;stick.style.left=(33+dx)+'px';stick.style.top=(33+dy)+'px'}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.active=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(joy.active)joyMove(e)});function joyEnd(){joy.active=false;joy.x=joy.y=0;stick.style.left='33px';stick.style.top='33px'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();attack()}if(e.key==='1')skill();if(e.key==='2')ice();if(e.key==='3')potion()});addEventListener('keyup',e=>keys[e.key]=false);
$('menuBtn').onclick=()=>openModal('Menu Petualangan',`<p>Selamat datang di <b>Legenda Arunika</b>, mini MMORPG fantasi 2D.</p><div class="menuGrid"><button onclick="window.gameMenu('quest')">📜 Quest</button><button onclick="window.gameMenu('status')">🧙 Status</button><button onclick="window.gameMenu('shop')">🛒 Toko</button><button onclick="window.gameMenu('help')">🎮 Cara Main</button></div><p id="menuLog">`+log+`</p>`);
function openModal(title,content){$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('modal').style.display='flex'}
window.gameMenu=(which)=>{if(which==='quest')openModal('Quest',`<p><b>Petualangan Pertama</b><br>Kalahkan 3 slime (${kills}/3).<br>Hadiah: 35 EXP dan 20 Gold.</p><p>${kills>=3?'Quest selesai! Terima kasih sudah membantu desa.':'Cari slime di sekitar hutan dan serang dengan ⚔️.'}</p>`);if(which==='status')openModal('Status Karakter',`<p>Nama: Arunika<br>Level: ${player.level}<br>HP: ${Math.ceil(player.hp)}/${player.maxHp}<br>MP: ${Math.ceil(player.mp)}/${player.maxMp}<br>EXP: ${player.xp}/${player.next}<br>Gold: ${player.gold}</p>`);if(which==='shop')openModal('Toko Desa',`<p>Pedagang menjual ramuan pemulih.</p><p>🧪 Potion HP — 10 Gold<br>Gold kamu: ${player.gold}</p><button class="closeBtn" onclick="window.buyPotion()">Beli Potion (10 Gold)</button>`);if(which==='help')openModal('Cara Bermain',`<p>• Gunakan joystick kiri untuk bergerak.<br>• Tombol ⚔️ menyerang monster terdekat.<br>• ✨ mengeluarkan sihir area (8 MP).<br>• ❄️ badai es area (12 MP).<br>• 🧪 memulihkan 45 HP.<br>• Dekati NPC Mira untuk melihat quest.<br>• Keyboard: WASD/panah, Space menyerang, 1/2 skill, 3 potion.</p><p>Ini prototipe offline: data hanya tersimpan selama halaman terbuka.</p>`)}
window.buyPotion=()=>{if(player.gold<10){toast('Gold tidak cukup!');return}player.gold-=10;player.potions++;$('potCount').textContent=player.potions;toast('Potion berhasil dibeli!');openModal('Toko Desa',`<p>🧪 Potion HP — 10 Gold<br>Gold kamu: ${player.gold}</p><button class="closeBtn" onclick="window.buyPotion()">Beli Potion (10 Gold)</button>`)}
$('closeModal').onclick=()=>$('modal').style.display='none';
canvas.addEventListener('pointerdown',e=>{if(e.target===canvas){let wx=e.clientX+camX,wy=e.clientY+camY;for(const n of npcs)if(Math.hypot(wx-n.x,wy-n.y)<45){if(n.name==='Mira')openModal('Mira — Penjaga Desa',`<p>Halo, petualang! Hutan di sekitar desa dipenuhi slime.</p><p>Quest: kalahkan 3 slime. Progres: ${kills}/3.</p><p>${kills>=3?'Hebat! Desa berterima kasih. Hadiah 20 Gold dan 35 EXP sudah diberikan.':'Kalahkan slime menggunakan tombol ⚔️. Kembali jika selesai!'}</p>`);else openModal('Pedagang',`<p>Butuh ramuan? Tekan Menu → Toko untuk membeli potion.</p>`);return}}});
let awarded=false;const oldUpdate=update;update=function(dt){oldUpdate(dt);if(kills>=3&&!awarded){awarded=true;player.gold+=20;player.xp+=35;toast('Quest selesai! +35 EXP dan +20 Gold');}};
function loop(now){let dt=Math.min((now-last)/1000,.04);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
